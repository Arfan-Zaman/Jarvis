<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>JARVIS AI Operating System</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/identity.css">
  <link rel="stylesheet" href="/static/hud.css">
  <link rel="stylesheet" href="/static/deck.css">
  <link rel="stylesheet" href="/static/motion.css">
  <link rel="stylesheet" href="/static/os.css">
</head>
<body class="os">
  <div class="os-wallpaper" aria-hidden="true"></div>

  <div class="os-boot" id="boot" aria-hidden="true">
    <div class="boot-mark"></div>
    <div class="boot-name">JARVIS</div>
    <div class="boot-sub">AI Operating System</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <header class="os-bar" role="banner">
    <div class="os-bar-left">
      <span class="os-logo" aria-hidden="true"></span>
      <b>JARVIS</b>
      <span class="os-app-title" id="app-title">Desktop</span>
    </div>
    <button class="os-ask" id="ask-open" type="button" aria-label="Ask JARVIS or open an app (Command K)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Ask JARVIS or open an app <kbd>⌘K</kbd>
    </button>
    <div class="os-bar-right">
      <span class="os-state" id="os-state"><i></i><span>Standing by</span></span>
      <span id="os-wifi" title="Wi-Fi"></span>
      <span id="os-battery" title="Battery"></span>
      <button class="os-bell" id="bell" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><b id="bell-count" hidden></b></button>
      <span class="os-clock" id="os-clock"></span>
    </div>
  </header>

  <main class="os-desktop" id="desktop">
    <aside class="os-widgets left" id="widgets-left"></aside>
    <aside class="os-widgets right" id="widgets-right"></aside>
    <div class="os-windows" id="windows"></div>
  </main>

  <aside class="os-notes" id="notes" hidden aria-label="Notifications"></aside>
  <div class="os-toasts" id="toasts-os" aria-live="polite"></div>

  <nav class="os-dock" id="dock" aria-label="Apps"></nav>

  <div class="os-palette" id="palette" hidden role="dialog" aria-label="Ask JARVIS">
    <div class="palette-box">
      <input id="palette-input" placeholder="Ask JARVIS, or type an app name" autocomplete="off" aria-label="Ask JARVIS or open an app">
      <div class="palette-list" id="palette-list"></div>
      <div class="palette-answer" id="palette-answer"></div>
    </div>
  </div>

  <script src="/static/identity.js" defer></script>
  <script src="/static/motion.js" defer></script>
  <script src="/static/ui.js" defer></script>
  <script src="/static/deck.js" defer></script>
  <script src="/static/os.js" defer></script>
</body>
</html>
